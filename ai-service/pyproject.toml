[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "testragem-ai-service"
version = "0.1.0"
description = "Internal AI research and market-regime service for Testragem"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.34,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0"]

[project.scripts]
testragem-ai = "testragem_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

