[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "testragem-engine"
version = "0.1.0"
description = "Testragem FastAPI engine"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]>=0.115,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]
