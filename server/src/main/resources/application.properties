spring.application.name=testragem-server
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/testragem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=TESTRAGEM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
auth.idle-timeout=30m
auth.absolute-timeout=8h
auth.public-url=${AUTH_PUBLIC_URL:http://localhost:5173}
auth.mail.from=${MAIL_FROM:}
# Set SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD in the backend environment.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Docker traffic readiness checks the application and required storage, not optional SMTP delivery.
# Keep the aggregate /actuator/health available for monitoring all configured integrations.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
backtest.dataset-csv=${BACKTEST_DATASET_CSV:}
backtest.dataset-source=${BACKTEST_DATASET_SOURCE:Operator-provided historical CSV}
spring.jackson.deserialization.accept-float-as-int=false
