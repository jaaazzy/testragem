spring.datasource.url=jdbc:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:pre-auth-schema.sql'
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Older PostgreSQL migrations use syntax that H2 cannot parse. Start from the
# equivalent pre-auth users schema and execute the real V6 migration under test.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
spring.flyway.target=8
